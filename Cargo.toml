[package]
name = "csrn"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Assurance: Charter and a bounded community trust-feed follower"
license = "FSL-1.1-ALv2"
repository = "https://github.com/corbet-libs/csrn"
publish = false

[features]
default = []
http = ["dep:reqwest"]

[dependencies]
cchr = { git = "https://github.com/corbet-foss/cchr", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
csgn = { git = "https://github.com/corbet-foss/csgn", branch = "main", default-features = false, features = ["volatile-signer"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", features = ["crypto"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[lints.rust]
unsafe_code = "forbid"
